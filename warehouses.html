<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المخازن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app wide">
    <header class="topbar">
      <div>
        <h1 id="siteTitle"><i class="fa-solid fa-location-dot"></i> المخازن</h1>
        <p>عرض تجريبي للكاميرات وبيانات الحساسات</p>
      </div>
      <div class="actions">
        <a href="locations.html" class="secondary-btn"><i class="fa-solid fa-arrow-right"></i> المواقع</a>
        <button id="logoutBtn" class="secondary-btn"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
      </div>
    </header>

    <section class="summary-grid">
      <div class="summary-card"><span>عدد المخازن</span><strong id="warehouseCount">12</strong></div>
      <div class="summary-card"><span>عدد الكاميرات</span><strong id="cameraCount">24</strong></div>
      <div class="summary-card"><span>الحساسات</span><strong id="sensorCount">12</strong></div>
      <div class="summary-card"><span>آخر تحديث</span><strong id="lastUpdate">--</strong></div>
    </section>

    <section id="warehousesGrid" class="warehouses-grid"></section>
  </div>

  <script src="js/common.js"></script>
  <script src="js/warehouses.js"></script>
</body>
</html>
